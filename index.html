<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐶 강아지 수집 배틀 RPG</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fb;
    font-family:"Segoe UI",sans-serif;
    padding:20px;
    transition:0.5s;
}

.card{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:20px;
    padding:24px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    text-align:center;
}

h1{
    margin-bottom:15px;
    color:#333;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-bottom:10px;
    font-weight:bold;
    color:#555;
    flex-wrap:wrap;
    gap:10px;
}

.image-box{
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:16px;
    background:#eee;
    margin-bottom:15px;
}

#dogImage{
    width:100%;
    height:100%;
    object-fit:cover;
}

#rarity{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

#loading{
    margin-bottom:15px;
}

.btn-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    border:none;
    border-radius:12px;
    padding:12px;
    color:white;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

#newDogBtn{
    background:#4f7cff;
    grid-column:span 2;
}

#likeBtn{
    background:#ff4f79;
}

#downloadBtn{
    background:#10b981;
}

#battleBtn{
    background:#ef4444;
}

#collectionBtn{
    background:#8b5cf6;
}

#autoBtn{
    background:#f59e0b;
    grid-column:span 2;
}

#autoBtn.active{
    background:#dc2626;
}

@media(max-width:600px){

    .stats{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<div class="card">

<h1>🐶 강아지 수집 배틀 RPG</h1>

<div class="stats">
    <span>📸 본 강아지 :
        <span id="viewCount">0</span>
    </span>

    <span>❤️ 좋아요 :
        <span id="likeCount">0</span>
    </span>
</div>

<div class="stats">
    <span>📖 도감 :
        <span id="collectionCount">0</span>
    </span>

    <span>🏆 승리 :
        <span id="winCount">0</span>
    </span>
</div>

<div class="stats">
    <span>🪙 코인 :
        <span id="coinCount">0</span>
    </span>
</div>

<h2 id="rarity">⚪ 일반</h2>

<div class="image-box">
    <img id="dogImage">
</div>

<p id="loading">
강아지 사진을 불러오는 중...
</p>

<div class="btn-group">

<button id="newDogBtn">
새로운 강아지 보기 🔄
</button>

<button id="likeBtn">
좋아요 ❤️
</button>

<button id="downloadBtn">
사진 저장 💾
</button>

<button id="battleBtn">
⚔️ 배틀
</button>

<button id="collectionBtn">
📖 도감
</button>

<button id="autoBtn">
자동 재생 시작 ▶️
</button>

</div>

<script>
