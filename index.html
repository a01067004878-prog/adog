<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐶 강아지 수집 배틀 RPG</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fb;
    font-family:"Segoe UI",sans-serif;
    padding:20px;
    transition:0.5s;
}

.card{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:20px;
    padding:24px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    text-align:center;
}

h1{
    margin-bottom:15px;
    color:#333;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-bottom:10px;
    font-weight:bold;
    color:#555;
    flex-wrap:wrap;
    gap:10px;
}

.image-box{
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:16px;
    background:#eee;
    margin-bottom:15px;
}

#dogImage{
    width:100%;
    height:100%;
    object-fit:cover;
}

#rarity{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

#loading{
    margin-bottom:15px;
}

.btn-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    border:none;
    border-radius:12px;
    padding:12px;
    color:white;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

#newDogBtn{
    background:#4f7cff;
    grid-column:span 2;
}

#likeBtn{
    background:#ff4f79;
}

#downloadBtn{
    background:#10b981;
}

#battleBtn{
    background:#ef4444;
}

#collectionBtn{
    background:#8b5cf6;
}

#autoBtn{
    background:#f59e0b;
    grid-column:span 2;
}

#autoBtn.active{
    background:#dc2626;
}

@media(max-width:600px){

    .stats{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<div class="card">

<h1>🐶 강아지 수집 배틀 RPG</h1>

<div class="stats">
    <span>📸 본 강아지 :
        <span id="viewCount">0</span>
    </span>

    <span>❤️ 좋아요 :
        <span id="likeCount">0</span>
    </span>
</div>

<div class="stats">
    <span>📖 도감 :
        <span id="collectionCount">0</span>
    </span>

    <span>🏆 승리 :
        <span id="winCount">0</span>
    </span>
</div>

<div class="stats">
    <span>🪙 코인 :
        <span id="coinCount">0</span>
    </span>
</div>

<h2 id="rarity">⚪ 일반</h2>

<div class="image-box">
    <img id="dogImage">
</div>

<p id="loading">
강아지 사진을 불러오는 중...
</p>

<div class="btn-group">

<button id="newDogBtn">
새로운 강아지 보기 🔄
</button>

<button id="likeBtn">
좋아요 ❤️
</button>

<button id="downloadBtn">
사진 저장 💾
</button>

<button id="battleBtn">
⚔️ 배틀
</button>

<button id="collectionBtn">
📖 도감
</button>

<button id="autoBtn">
자동 재생 시작 ▶️
</button>

</div>

<script>
const dogImage = document.getElementById("dogImage");
const loading = document.getElementById("loading");

const viewCountEl = document.getElementById("viewCount");
const likeCountEl = document.getElementById("likeCount");
const collectionCountEl = document.getElementById("collectionCount");
const winCountEl = document.getElementById("winCount");
const coinCountEl = document.getElementById("coinCount");
const rarityEl = document.getElementById("rarity");

const newDogBtn = document.getElementById("newDogBtn");
const likeBtn = document.getElementById("likeBtn");
const downloadBtn = document.getElementById("downloadBtn");
const battleBtn = document.getElementById("battleBtn");
const collectionBtn = document.getElementById("collectionBtn");
const autoBtn = document.getElementById("autoBtn");

// =========================
// GAME STATE
// =========================

let totalViewed =
Number(localStorage.getItem("viewed")) || 0;

let likedDogs =
JSON.parse(localStorage.getItem("likedDogs")) || [];

let dogCollection =
JSON.parse(localStorage.getItem("dogCollection")) || [];

let playerWins =
Number(localStorage.getItem("wins")) || 0;

let coins =
Number(localStorage.getItem("coins")) || 0;

let currentImgUrl = "";
let currentDog = null;

let autoInterval = null;

// =========================
// UPDATE UI
// =========================

function updateUI() {
viewCountEl.textContent = totalViewed;
likeCountEl.textContent = likedDogs.length;
collectionCountEl.textContent = dogCollection.length;
winCountEl.textContent = playerWins;
coinCountEl.textContent = coins;
}

// =========================
// SAVE
// =========================

function saveGame() {
localStorage.setItem("viewed", totalViewed);
localStorage.setItem("likedDogs", JSON.stringify(likedDogs));
localStorage.setItem("dogCollection", JSON.stringify(dogCollection));
localStorage.setItem("wins", playerWins);
localStorage.setItem("coins", coins);
}

// =========================
// RARITY SYSTEM
// =========================

function getRarity(total) {
if (total >= 250) return { name: "🌈 전설", color: "#f59e0b" };
if (total >= 220) return { name: "💜 영웅", color: "#a855f7" };
if (total >= 180) return { name: "💙 희귀", color: "#3b82f6" };
return { name: "⚪ 일반", color: "#9ca3af" };
}

// =========================
// DOG DATA
// =========================

function createDog(url) {
const atk = Math.floor(Math.random() * 50) + 50;
const def = Math.floor(Math.random() * 50) + 50;
const hp = Math.floor(Math.random() * 50) + 50;

const total = atk + def + hp;
const rarity = getRarity(total);

return {
url,
atk,
def,
hp,
total,
rarity
};
}

// =========================
// BACKGROUND
// =========================

const colors = [
"#ffe5ec","#d8f3dc","#fcd5ce","#e0aaff",
"#cdb4db","#bde0fe","#ffc8dd"
];

function changeBg() {
document.body.style.background =
colors[Math.floor(Math.random()*colors.length)];
}

// =========================
// GET DOG IMAGE
// =========================

async function getDogImage() {
loading.textContent = "강아지 사진을 불러오는 중...";

try {
const res = await fetch("https://dog.ceo/api/breeds/image/random");
const data = await res.json();

currentImgUrl = data.message;
dogImage.src = currentImgUrl;

dogImage.onload = () => {

loading.textContent = "완료!";

totalViewed++;
coins += 5;

currentDog = createDog(currentImgUrl);

// rarity 표시
rarityEl.textContent = currentDog.rarity.name;
rarityEl.style.color = currentDog.rarity.color;

// 도감 등록 (중복 방지)
const exists = dogCollection.some(
d => d.url === currentImgUrl
);

if (!exists) {
dogCollection.push(currentDog);
}

// 배경 변경
changeBg();

// UI + 저장
updateUI();
saveGame();
};

} catch (err) {
loading.textContent = "불러오기 실패";
}
}

// =========================
// LIKE SYSTEM
// =========================

likeBtn.addEventListener("click", () => {

if (!currentImgUrl) return;

if (!likedDogs.includes(currentImgUrl)) {
likedDogs.push(currentImgUrl);
updateUI();
saveGame();
alert("❤️ 좋아요 저장!");
}

});

// =========================
// DOWNLOAD IMAGE
// =========================

downloadBtn.addEventListener("click", async () => {

if (!currentImgUrl) return;

const res = await fetch(currentImgUrl);
const blob = await res.blob();

const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = `dog-${Date.now()}.jpg`;

document.body.appendChild(a);
a.click();
document.body.removeChild(a);

URL.revokeObjectURL(url);
});

// =========================
// NEW DOG BUTTON
// =========================

newDogBtn.addEventListener("click", getDogImage);

// =========================
// BATTLE SYSTEM
// =========================

battleBtn.addEventListener("click", () => {

if (!currentDog) return;

// 적 생성
const enemy = {
atk: Math.floor(Math.random() * 100) + 50,
def: Math.floor(Math.random() * 100) + 50,
hp: Math.floor(Math.random() * 100) + 50
};

const enemyPower =
enemy.atk + enemy.def + enemy.hp;

const myPower =
currentDog.atk +
currentDog.def +
currentDog.hp;

// 승패 판정
if (myPower > enemyPower) {

playerWins++;
coins += 20;

alert(
`🏆 승리!\n\n` +
`내 전투력: ${myPower}\n` +
`상대 전투력: ${enemyPower}`
);

} else {

alert(
`💀 패배...\n\n` +
`내 전투력: ${myPower}\n` +
`상대 전투력: ${enemyPower}`
);

}

// UI 업데이트
updateUI();
saveGame();

});

// =========================
// COLLECTION VIEW
// =========================

collectionBtn.addEventListener("click", () => {

if (dogCollection.length === 0) {
alert("도감이 비어 있습니다!");
return;
}

let text = "📖 강아지 도감\n\n";

dogCollection.forEach((dog, i) => {

text +=
`${i + 1}번\n` +
`${dog.rarity.name}\n` +
`⚔️ ${dog.atk}\n` +
`🛡️ ${dog.def}\n` +
`❤️ ${dog.hp}\n\n`;

});

alert(text);

});

// =========================
// AUTO PLAY
// =========================

autoBtn.addEventListener("click", () => {

if (autoInterval) {

clearInterval(autoInterval);
autoInterval = null;

autoBtn.textContent = "자동 재생 시작 ▶️";
autoBtn.classList.remove("active");

} else {

getDogImage();

autoInterval = setInterval(() => {
getDogImage();
}, 2500);

autoBtn.textContent = "자동 재생 중지 ⏹️";
autoBtn.classList.add("active");

}

});

// =========================
// INIT UI
// =========================

function init() {
updateUI();
getDogImage();
}

init();

</script>

</body>
</html>
